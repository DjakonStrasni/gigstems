<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigStems - Prototip v1.0.0</title>
    <!-- Poziv eksternog CSS-a radi očuvanja konzistentnosti dizajna -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>GigStems</h1>
    <p class="subtitle">v1.0.0 • Prototip sinhronizacije</p>

    <!-- Kontrolna Tabla -->
    <div class="controls-master">
        <div class="buttons-row">
            <button id="playBtn" class="btn-play" onclick="togglePlay()" disabled>
                <span>▶ Pusti Test</span>
            </button>
            <button id="stopBtn" class="btn-stop" onclick="stopAudio()" disabled>
                <span>◼ Zaustavi</span>
            </button>
        </div>

        <div class="seekbar-container">
            <input type="range" id="seekBar" class="seekbar" min="0" max="100" value="0" oninput="onSeek(this.value)">
        </div>

        <div class="time-container">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <!-- Status Učitavanja -->
    <div id="statusLabel" class="status-box">Sintetizujem test trake u memoriji...</div>

    <!-- Mikseta -->
    <div id="mixerContainer" class="mixer"></div>

    <script>
        // Inicijalizacija Web Audio API-ja i globalnih promenljivih
        let audioCtx;
        let audioBuffers = [];
        let sourceNodes = [];
        let gainNodes = [];
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;
        let totalDuration = 30; // Definišemo trajanje od 30 sekundi za naš sintetizovani test
        let timerInterval;

        // Nazivi test kanala koje ćemo programski generisati
        const testTracks = [
            { name: "Klik/Bubanj (Metronome)" },
            { name: "Bas/Ton (Synth Bass)" },
            { name: "Melodija (Synth Scale)" }
        ];

        // Automatsko pokretanje generisanja čim se stranica otvori
        window.onload = () => {
            initAudioAndGenerate();
        };

        // #NOVO v1.0.0 - Programsko generisanje audio signala direktno u RAM memoriju.
        // Na ovaj način potpuno izbegavamo CORS greške i mrežne probleme na telefonima i računarima.
        async function initAudioAndGenerate() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const statusLabel = document.getElementById('statusLabel');
                const sampleRate = audioCtx.sampleRate;
                const bufferSize = sampleRate * totalDuration;

                // 1. Generisanje trake: Klik/Bubanj (Kratak taster na svakih 0.5s - 120 BPM)
                statusLabel.innerText = "Sintetizujem kanal: Klik/Bubanj...";
                const clickBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                const clickData = clickBuffer.getChannelData(0);
                const clickInterval = 0.5; // 0.5 sekundi (120 BPM)
                for (let t = 0; t < totalDuration; t += clickInterval) {
                    const startSample = Math.floor(t * sampleRate);
                    const clickLength = Math.floor(0.04 * sampleRate); // 40ms klik
                    for (let i = 0; i < clickLength; i++) {
                        if (startSample + i < bufferSize) {
                            // Sinusni talas od 800Hz koji brzo slabi (decay)
                            clickData[startSample + i] = Math.sin(2 * Math.PI * 800 * (i / sampleRate)) * Math.exp(-i / (0.008 * sampleRate));
                        }
                    }
                }
                audioBuffers.push(clickBuffer);

                // 2. Generisanje trake: Bas/Ton (Niski pulsirajući ton od 55Hz na svaku sekundu)
                statusLabel.innerText = "Sintetizujem kanal: Bas/Ton...";
                const bassBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                const bassData = bassBuffer.getChannelData(0);
                for (let t = 0; t < totalDuration; t += 1.0) {
                    const startSample = Math.floor(t * sampleRate);
                    const noteLength = Math.floor(0.8 * sampleRate); // 800ms trajanje note
                    for (let i = 0; i < noteLength; i++) {
                        if (startSample + i < bufferSize) {
                            // Sinusni talas na 55Hz (A1) sa linearnim slabljenjem jačine
                            bassData[startSample + i] = Math.sin(2 * Math.PI * 55 * (i / sampleRate)) * 0.6 * (1 - i / noteLength);
                        }
                    }
                }
                audioBuffers.push(bassBuffer);

                // 3. Generisanje trake: Melodija (Kratka skala koja menja note na svaku sekundu)
                statusLabel.innerText = "Sintetizujem kanal: Melodija...";
                const melodyBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                const melodyData = melodyBuffer.getChannelData(0);
                const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5 note
                for (let t = 0; t < totalDuration; t += 1.0) {
                    const noteIdx = Math.floor(t) % notes.length;
                    const freq = notes[noteIdx];
                    const startSample = Math.floor(t * sampleRate);
                    const noteLength = Math.floor(0.6 * sampleRate);
                    for (let i = 0; i < noteLength; i++) {
                        if (startSample + i < bufferSize) {
                            // Sinusni talas izabrane frekvencije sa slabljenjem jačine
                            melodyData[startSample + i] = Math.sin(2 * Math.PI * freq * (i / sampleRate)) * 0.3 * (1 - i / noteLength);
                        }
                    }
                }
                audioBuffers.push(melodyBuffer);

                // Prikaz da je sve spremno
                statusLabel.innerText = "Sve lokalne test trake su uspešno generisane u RAM-u!";
                document.getElementById('totalTime').innerText = formatTime(totalDuration);
                
                buildMixer();
                document.getElementById('playBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
            } catch (err) {
                document.getElementById('statusLabel').innerText = "Greška pri inicijalizaciji audio generatora.";
                console.error("Greška tokom generisanja zvuka:", err);
            }
        }

        // Dinamičko kreiranje miksete na ekranu
        function buildMixer() {
            const container = document.getElementById('mixerContainer');
            container.innerHTML = '';

            testTracks.forEach((track, index) => {
                // Kreiramo GainNode (regulator jačine) za svaki kanal posebno
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.8; // Podrazumevana jačina na 80%
                gainNodes.push(gainNode);

                const strip = document.createElement('div');
                strip.className = 'track-strip';
                strip.innerHTML = `
                    <div class="track-name">${track.name}</div>
                    <div class="volume-slider-container">
                        <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(${index}, this.value)">
                    </div>
                    <button id="muteBtn-${index}" class="btn-mute" onclick="toggleMute(${index})">MUTE</button>
                    <button id="soloBtn-${index}" class="btn-solo" onclick="toggleSolo(${index})">SOLO</button>
                `;
                container.appendChild(strip);
            });
        }

        // Kontrola jačine kanala
        function setVolume(index, value) {
            const isMuted = document.getElementById(`muteBtn-${index}`).classList.contains('active');
            if (!isMuted) {
                gainNodes[index].gain.setValueAtTime(value, audioCtx.currentTime);
            }
        }

        // Mute funkcionalnost bez zaustavljanja plejera
        function toggleMute(index) {
            const btn = document.getElementById(`muteBtn-${index}`);
            const slider = btn.parentNode.querySelector('.volume-slider');
            const isActive = btn.classList.toggle('active');

            if (isActive) {
                gainNodes[index].gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                gainNodes[index].gain.setValueAtTime(slider.value, audioCtx.currentTime);
            }
        }

        // Solo funkcionalnost (utišava sve ostale kanale)
        function toggleSolo(index) {
            const btn = document.getElementById(`soloBtn-${index}`);
            const isSoloActive = btn.classList.toggle('active');

            gainNodes.forEach((gn, i) => {
                const sliderVal = document.getElementById(`mixerContainer`).querySelectorAll('.volume-slider')[i].value;
                const isMuted = document.getElementById(`muteBtn-${i}`).classList.contains('active');
                const soloBtn = document.getElementById(`soloBtn-${i}`);

                if (isSoloActive) {
                    if (i !== index) {
                        gn.gain.setValueAtTime(0, audioCtx.currentTime);
                        soloBtn.classList.remove('active');
                    } else {
                        gn.gain.setValueAtTime(isMuted ? 0 : sliderVal, audioCtx.currentTime);
                    }
                } else {
                    gn.gain.setValueAtTime(isMuted ? 0 : sliderVal, audioCtx.currentTime);
                }
            });
        }

        // Play i Pause logika sa sinhronim startom u milisekundu
        function togglePlay() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const playBtn = document.getElementById('playBtn');

            if (isPlaying) {
                // Pause stanje
                pauseOffset += audioCtx.currentTime - startTime;
                stopSourceNodes();
                isPlaying = false;
                playBtn.innerHTML = "<span>▶ Pusti Test</span>";
                clearInterval(timerInterval);
            } else {
                // Play stanje
                if (pauseOffset >= totalDuration) {
                    pauseOffset = 0; // Vrati na početak ako je pesma završena
                }
                startSourceNodes(pauseOffset);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerHTML = "<span>⏸ Pauziraj</span>";
                timerInterval = setInterval(updateUI, 100);
            }
        }

        // Pokretanje svih audio čvorova u tačnom vremenskom trenutku
        function startSourceNodes(offset) {
            sourceNodes = [];
            audioBuffers.forEach((buffer, index) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                // Povezujemo izvor na kanalni Gain, a kanalni Gain na zvučnike (destination)
                source.connect(gainNodes[index]);
                gainNodes[index].connect(audioCtx.destination);
                
                if (offset < buffer.duration) {
                    source.start(0, offset);
                } else {
                    source.start(0, buffer.duration);
                }
                sourceNodes.push(source);
            });
        }

        function stopSourceNodes() {
            sourceNodes.forEach(node => {
                try { node.stop(); } catch(err) {}
            });
            sourceNodes = [];
        }

        // Potpuno zaustavljanje i resetovanje plejera
        function stopAudio() {
            stopSourceNodes();
            isPlaying = false;
            pauseOffset = 0;
            document.getElementById('playBtn').innerHTML = "<span>▶ Pusti Test</span>";
            document.getElementById('currentTime').innerText = "00:00";
            document.getElementById('seekBar').value = 0;
            clearInterval(timerInterval);
        }

        // Logika za premotavanje pesme (Seeking)
        function onSeek(value) {
            const wasPlaying = isPlaying;
            if (isPlaying) {
                togglePlay(); // Privremeno pauziraj
            }
            pauseOffset = (value / 100) * totalDuration;
            document.getElementById('currentTime').innerText = formatTime(pauseOffset);
            
            if (wasPlaying) {
                togglePlay(); // Nastavi da sviraš sa nove lokacije
            }
        }

        // Praćenje vremena i pomeranje klizača tokom reprodukcije
        function updateUI() {
            if (!isPlaying) return;
            const elapsed = pauseOffset + (audioCtx.currentTime - startTime);
            
            if (elapsed >= totalDuration) {
                stopAudio();
                return;
            }

            document.getElementById('currentTime').innerText = formatTime(elapsed);
            document.getElementById('seekBar').value = (elapsed / totalDuration) * 100;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
    </script>
</body>
</html>
