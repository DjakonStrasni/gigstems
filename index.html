<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigStems - Prototip v1.3.4</title>
    <!-- Poziv eksternog CSS-a radi očuvanja konzistentnosti dizajna -->
    <link rel="stylesheet" href="style.css">
    <!-- Eksterni fajl sa prevodima radi lakšeg uređivanja i lokalizacije -->
    <script src="translations.js"></script>
</head>
<body>

    <!-- Zatamnjenje ekrana za mobilni kada je otvoren klizni meni sa pesmama -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <!-- Kontejner za celu aplikaciju koji spaja Sidebar i Glavni sadržaj -->
    <div class="app-container">

        <!-- LEVA KOLONA: Sidebar (Pretraga, Lista pesama i Bendovi) -->
        <div id="appSidebar" class="sidebar">
            
            <!-- Upravljanje bendovima ("Moji Bendovi" / "Moje Baze") -->
            <div class="band-selector-zone">
                <span id="activeBandLabel" class="input-label">Bend:</span>
                <div class="band-row">
                    <select id="bandSelect" class="band-select" onchange="onBandChanged(this.value)">
                        <!-- Popunjava se dinamički iz localStorage-a -->
                    </select>
                    <button id="addBandBtn" class="btn-add-band" onclick="toggleAddBandPanel()">Upravljaj</button>
                </div>

                <!-- Elegantan i vizuelno odvojen panel za upravljanje i dodavanje bendova -->
                <div id="addBandPanel" class="band-manager-panel" style="display: none;">
                    
                    <!-- Sekcija 1: Uredi trenutni bend (Edit Current Band) - Prikazuje se samo ako bend postoji -->
                    <div id="renameBandSection" class="manager-section">
                        <span id="editSectionTitle" class="manager-section-title">✏️ Uredi Aktivni Bend</span>
                        
                        <div class="input-group">
                            <label id="renameBandLabel" class="input-label" for="renameBandNameInput">Naziv trenutnog benda:</label>
                            <input type="text" id="renameBandNameInput" class="settings-input" placeholder="Novi naziv">
                        </div>
                        
                        <div class="input-group" style="margin-top: 5px;">
                            <label id="renameBandUrlLabel" class="input-label" for="renameBandUrlInput">Link Drive foldera:</label>
                            <input type="text" id="renameBandUrlInput" class="settings-input" placeholder="Nalepi novi URL foldera">
                        </div>
                        
                        <button id="renameBtn" class="btn-connect" onclick="updateActiveBandSubmit()" style="margin-top: 5px;">Sačuvaj izmene</button>
                    </div>

                    <!-- Sekcija 2: Dodaj novi bend (Add New Band) -->
                    <div id="newBandSection" class="manager-section">
                        <span id="addSectionTitle" class="manager-section-title">➕ Dodaj Novi Bend</span>
                        
                        <div class="input-group">
                            <label id="bandNameLabel" class="input-label" for="newBandName">Naziv novog benda:</label>
                            <input type="text" id="newBandName" class="settings-input" placeholder="Npr. Deep Purple">
                        </div>
                        <div class="input-group" style="margin-top: 5px;">
                            <label id="bandUrlLabel" class="input-label" for="newBandUrl">Google Drive Link Foldera:</label>
                            <input type="text" id="newBandUrl" class="settings-input" placeholder="Nalepi ceo URL drajv foldera">
                        </div>
                        <button id="connectBtn" class="btn-connect" onclick="addNewBandSubmit()" style="margin-top: 5px;">Dodaj novi bend</button>
                    </div>
                    
                    <!-- Brisanje - Crveno i izolovano na dnu -->
                    <button id="deleteBandBtn" class="btn-delete-band" onclick="deleteActiveBand()">❌ Obriši ovaj bend</button>
                </div>
            </div>

            <!-- Polje za brzu pretragu / filtriranje pesama sa drajva -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Pretraži pesmu..." oninput="filterSongs(this.value)">
            </div>

            <!-- Naslov i Dinamički spisak pesama -->
            <div class="songs-title-container">
                <span id="songsTitle" class="songs-title">📋 Spisak Pesama</span>
            </div>
            <div id="songsList" class="songs-list">
                <!-- Pesme se iscrtavaju ovde kao klikabilne stavke -->
            </div>
        </div>

        <!-- DESNA KOLONA: Glavni radni prostor (Plejer, Mikseta) -->
        <div class="main-content">
            
            <!-- Zaglavlje sa naslovom i jezičkim kontrolama -->
            <div class="app-header">
                <div>
                    <h1>GigStems</h1>
                    <p id="subtitleText" class="subtitle">v1.3.4 • Repertoar i Menadžment</p>
                </div>
                
                <div style="display: flex; gap: 10px; align-items: center;">
                    <!-- Dugme za otvaranje repertoara na mobilnim telefonima -->
                    <button id="mobileToggleBtn" class="mobile-toggle-btn" onclick="toggleSidebar(true)">📋 Pesme</button>
                    
                    <div class="lang-container">
                        <button id="lang-sr" class="btn-lang" onclick="setLanguage('sr')">SR</button>
                        <button id="lang-en" class="btn-lang" onclick="setLanguage('en')">EN</button>
                    </div>
                </div>
            </div>

            <!-- Kontrolna Tabla Plejera -->
            <div class="controls-master">
                <div class="buttons-row">
                    <button id="playBtn" class="btn-play" onclick="togglePlay()" disabled style="width: 60%;">
                        <span>▶ Pusti trake</span>
                    </button>
                    <button id="stopBtn" class="btn-stop" onclick="stopAudio()" disabled style="width: 35%;">
                        <span>◼ Zaustavi</span>
                    </button>
                </div>

                <!-- Globalne (Master) kontrole jačine zvuka i mute u krovnoj tabli -->
                <div class="master-volume-container">
                    <button id="masterMuteBtn" class="btn-mute" onclick="toggleMasterMute()" style="width: auto; padding: 6px 12px;">UTIŠAJ SVE</button>
                    <div class="volume-slider-container" style="flex-grow: 1; display: flex; align-items: center; justify-content: flex-end; margin-left: 10px;">
                        <span id="masterVolLabel" class="master-vol-label">MASTER:</span>
                        <input type="range" id="masterVolumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setMasterVolume(this.value)" style="margin-left: 10px; width: 100%;">
                    </div>
                </div>

                <div class="seekbar-container" style="margin-top: 12px;">
                    <input type="range" id="seekBar" class="seekbar" min="0" max="100" value="0" oninput="onSeek(this.value)">
                </div>

                <div class="time-container">
                    <span id="currentTime">00:00</span>
                    <span id="totalTime">00:00</span>
                </div>
            </div>

            <!-- Status Učitavanja i Sinhronizacije -->
            <div id="statusLabel" class="status-box">Izaberi pesmu sa leve strane da započneš...</div>

            <!-- Mikseta -->
            <div id="mixerContainer" class="mixer"></div>
        </div>

    </div>

    <script>
        // ==========================================================================
        // GIGSTEMS AUDIO ENGINE & CONTROL LOGIC (v1.3.4)
        // ==========================================================================

        // TVOJ BEZBEDNI API KLJUČ (Ograničen na tvoj GitHub Pages domen)
        const GIGSTEMS_API_KEY = "UPISI_OVDE_SVOJ_API_KLJUC";

        // Inicijalizacija Web Audio API-ja i globalnih promenljivih
        let audioCtx;
        let audioBuffers = [];
        let sourceNodes = [];
        let gainNodes = [];
        let trackNames = [];
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;
        let totalDuration = 0;
        let timerInterval;

        // Globalne promenljive za master kontrolu
        let masterGainNode; 
        let isMasterMuted = false;

        // Promenljive za upravljanje pesmama i pretragom
        let currentSongName = "";
        let allSongs = []; // Lista svih foldera/pesama iz aktivnog drajva

        // Pamćenje i učitavanje izabranog jezika iz Local Storage-a
        let currentLang = localStorage.getItem('gigstems_lang') || 'sr';

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusLabel = document.getElementById('statusLabel');
        const songsList = document.getElementById('songsList');
        const bandSelect = document.getElementById('bandSelect');

        // Popravljeno skladištenje i učitavanje bendova na jedinstvenom ključu
        let isFirstRun = localStorage.getItem('gigstems_first_run') === null;
        let bands = JSON.parse(localStorage.getItem('gigstems_bands'));
        
        if (isFirstRun && (!bands || bands.length === 0)) {
            bands = [
                { id: 'default_fankomatik', name: 'Fankomatik', folderId: '1uUxKmjU6MgmsLCk5jSUrA29m4SkkShGA', rawUrl: 'https://drive.google.com/drive/folders/1uUxKmjU6MgmsLCk5jSUrA29m4SkkShGA' }
            ];
            localStorage.setItem('gigstems_bands', JSON.stringify(bands));
            localStorage.setItem('gigstems_first_run', 'false');
        } else if (!bands) {
            bands = [];
        }
        
        let activeBandId = localStorage.getItem('gigstems_active_band');

        // Rešen problem sa učitavanjem kada je samo jedan bend u listi i ispravljen critical bug 'bands.id'
        if (bands.length > 0) {
            if (!activeBandId || !bands.some(b => b.id === activeBandId)) {
                activeBandId = bands.id;
                localStorage.setItem('gigstems_active_band', activeBandId);
            }
        } else {
            activeBandId = "";
            localStorage.setItem('gigstems_active_band', "");
        }

        // Automatsko pokretanje čim se stranica otvori
        window.onload = () => {
            setLanguage(currentLang);
            renderBandsUI();

            // Postavljanje inicijalne vrednosti master klizača iz localStorage
            const savedMasterVol = localStorage.getItem('gigstems_master_volume');
            if (savedMasterVol !== null) {
                document.getElementById('masterVolumeSlider').value = savedMasterVol;
            }

            // Automatski pokrećemo učitavanje repertoara za aktivni bend
            loadSongsFromActiveBand();
        };

        // Funkcija za dinamičku promenu jezika na celom interfejsu bez osvežavanja stranice
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('gigstems_lang', lang);

            // Ažuriramo aktivne klase na tasterima za jezik
            document.getElementById('lang-sr').classList.toggle('active', lang === 'sr');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');

            // Prevodimo statičke tekstove
            document.getElementById('subtitleText').innerText = i18n[lang].subtitle;
            stopBtn.querySelector('span').innerText = i18n[lang].stopBtn;
            
            document.getElementById('masterMuteBtn').innerText = i18n[lang].masterMuteBtn;
            document.getElementById('masterVolLabel').innerText = i18n[lang].masterVolLabel;

            // Prevod upravljača bendovima i pretrage
            document.getElementById('activeBandLabel').innerText = i18n[lang].activeBandLabel;
            document.getElementById('addBandBtn').innerText = i18n[lang].addBandBtn;
            document.getElementById('bandNameLabel').innerText = i18n[lang].bandNameLabel;
            document.getElementById('bandUrlLabel').innerText = i18n[lang].bandUrlLabel;
            document.getElementById('connectBtn').innerText = i18n[lang].connectBtn;
            document.getElementById('deleteBandBtn').innerText = i18n[lang].deleteBandBtnText;
            document.getElementById('searchInput').placeholder = i18n[lang].searchPlaceholder;
            document.getElementById('songsTitle').innerText = i18n[lang].songsTitle;
            document.getElementById('mobileToggleBtn').innerText = "📋 " + i18n[lang].songsTitle.split(" ").slice(1).join(" ");
            
            document.getElementById('editSectionTitle').innerText = i18n[lang].editSectionTitle;
            document.getElementById('addSectionTitle').innerText = i18n[lang].addSectionTitle;
            document.getElementById('renameBandLabel').innerText = i18n[lang].renameBandLabel;
            document.getElementById('renameBandUrlLabel').innerText = i18n[lang].renameBandUrlLabel;
            document.getElementById('renameBtn').innerText = i18n[lang].renameBtn;

            // Prevodimo play/pause taster
            updatePlayBtnUI();

            // Prevodimo trenutni status u zavisnosti od stanja audio buffera
            if (audioBuffers.length === 0) {
                updateStatusText('statusInit');
            } else {
                updateStatusText('statusReady', audioBuffers.length);
            }
        }

        // Pomoćna funkcija za ažuriranje teksta statusne trake
        function updateStatusText(key, param = null) {
            let text = i18n[currentLang][key];
            if (param !== null) {
                text = text.replace("{count}", param);
            }
            statusLabel.innerText = text;
        }

        // Pomoćna funkcija za vizuelni prikaz Play/Pause stanja u skladu sa izabranim jezikom
        function updatePlayBtnUI() {
            if (isPlaying) {
                playBtn.innerHTML = `<span>⏸ ${i18n[currentLang].pauseBtn}</span>`;
            } else {
                playBtn.innerHTML = `<span>▶ ${i18n[currentLang].playBtn}</span>`;
            }
        }

        // Iscrtavanje liste bendova u dropdown-u
        function renderBandsUI() {
            bandSelect.innerHTML = "";
            
            // Podrška za "-- Bez benda --" opciju kada nema bendova
            if (bands.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = i18n[currentLang].selectBandPlaceholder;
                opt.disabled = true;
                opt.selected = true;
                bandSelect.appendChild(opt);
                bandSelect.disabled = true;
                
                // Sakrivamo edit sekciju i delete dugme jer nemamo bend
                document.getElementById('renameBandSection').style.display = "none";
                document.getElementById('deleteBandBtn').style.display = "none";
            } else {
                bandSelect.disabled = false;
                
                document.getElementById('renameBandSection').style.display = "flex";
                document.getElementById('deleteBandBtn').style.display = "block";
                
                bands.forEach(band => {
                    const opt = document.createElement('option');
                    opt.value = band.id;
                    opt.innerText = band.name;
                    opt.selected = (band.id === activeBandId);
                    bandSelect.appendChild(opt);
                });

                // Pre-popunjavamo polja za uvoz i preimenovanje aktivnog benda
                const activeBand = bands.find(b => b.id === activeBandId);
                if (activeBand) {
                    document.getElementById('renameBandNameInput').value = activeBand.name;
                    document.getElementById('renameBandUrlInput').value = activeBand.rawUrl || "";
                }
            }
        }

        // Sklopivi/rasklopivi panel za dodavanje bendova
        function toggleAddBandPanel() {
            const panel = document.getElementById('addBandPanel');
            panel.style.display = (panel.style.display === "none") ? "flex" : "none";
        }

        // Pametni Regular Expression parser koji izvlači ID foldera iz celog Google Drive URL-a
        function extractFolderId(urlOrId) {
            const regExp = /[-\w]{25,}/;
            const match = urlOrId.match(regExp);
            return match ? match : urlOrId;
        }

        // Dodavanje novog benda sa prevencijom duplih imena i drajv linkova i ispravkom localStorage ključa
        function addNewBandSubmit() {
            const nameInput = document.getElementById('newBandName');
            const urlInput = document.getElementById('newBandUrl');

            const name = nameInput.value.trim();
            const rawUrl = urlInput.value.trim();

            if (!name || !rawUrl) {
                alert(currentLang === 'sr' ? "Popuni sva polja!" : "Please fill out all fields!");
                return;
            }

            // Provera jedinstvenosti naziva benda
            const isNameDuplicate = bands.some(b => b.name.toLowerCase() === name.toLowerCase());
            if (isNameDuplicate) {
                alert(i18n[currentLang].duplicateNameError);
                return;
            }

            const folderId = extractFolderId(rawUrl);

            // Provera jedinstvenosti linka
            const isUrlDuplicate = bands.some(b => b.folderId === folderId);
            if (isUrlDuplicate) {
                alert(i18n[currentLang].duplicateUrlError);
                return;
            }

            // Kreiramo novi bend
            const newBand = {
                id: 'band_' + Date.now(),
                name: name,
                folderId: folderId,
                rawUrl: rawUrl
            };

            bands.push(newBand);
            localStorage.setItem('gigstems_bands', JSON.stringify(bands));

            activeBandId = newBand.id;
            localStorage.setItem('gigstems_active_band', activeBandId);

            // Čistimo formu i sklapamo je
            nameInput.value = "";
            urlInput.value = "";
            document.getElementById('addBandPanel').style.display = "none";

            renderBandsUI();
            loadSongsFromActiveBand();
        }

        // Sačuvaj izmene (Uredi trenutni bend) sa detaljnom i bezbednom proverom duplih unosa
        function updateActiveBandSubmit() {
            const nameInput = document.getElementById('renameBandNameInput');
            const urlInput = document.getElementById('renameBandUrlInput');
            const newName = nameInput.value.trim();
            const newUrl = urlInput.value.trim();

            if (!newName) {
                alert(i18n[currentLang].emptyNameError);
                return;
            }

            const activeBand = bands.find(b => b.id === activeBandId);
            if (activeBand) {
                // Provera da li neko drugi koristi isto ime
                const isNameDuplicate = bands.some(b => b.id !== activeBandId && b.name.toLowerCase() === newName.toLowerCase());
                if (isNameDuplicate) {
                    alert(i18n[currentLang].duplicateNameError);
                    return;
                }

                activeBand.name = newName;
                if (newUrl) {
                    const newFolderId = extractFolderId(newUrl);
                    
                    // Provera da li neko drugi koristi isti Drive folder
                    const isUrlDuplicate = bands.some(b => b.id !== activeBandId && b.folderId === newFolderId);
                    if (isUrlDuplicate) {
                        alert(i18n[currentLang].duplicateUrlError);
                        return;
                    }

                    activeBand.folderId = newFolderId;
                    activeBand.rawUrl = newUrl;
                }

                localStorage.setItem('gigstems_bands', JSON.stringify(bands));
                renderBandsUI();
                loadSongsFromActiveBand();
                document.getElementById('addBandPanel').style.display = "none";
            }
        }

        // Ispravljeno brisanje bendova sa automatskim prebacivanjem na ispravnu selekciju nulte kartice i brisanjem lokalnih tragova
        function deleteActiveBand() {
            if (bands.length === 0) return;

            const confirmMsg = i18n[currentLang].deleteBandConfirm;
            if (!confirm(confirmMsg)) return;

            bands = bands.filter(b => b.id !== activeBandId);
            localStorage.setItem('gigstems_bands', JSON.stringify(bands));

            // Pravilno ažuriramo sledeći aktivni ID (eliminisan bands.id critical bug)
            if (bands.length > 0) {
                activeBandId = bands.id;
            } else {
                activeBandId = "";
            }
            localStorage.setItem('gigstems_active_band', activeBandId);

            document.getElementById('addBandPanel').style.display = "none";
            renderBandsUI();
            loadSongsFromActiveBand();
        }

        // Akcija pri izmeni aktivnog benda u dropdownu
        function onBandChanged(newId) {
            activeBandId = newId;
            localStorage.setItem('gigstems_active_band', activeBandId);
            
            // Zaustavljamo reprodukciju i čistimo stari mikser
            stopAudio();
            document.getElementById('mixerContainer').innerHTML = "";
            
            // Sinhronizujemo preimenovanje input vrednosti
            const activeBand = bands.find(b => b.id === activeBandId);
            if (activeBand) {
                document.getElementById('renameBandNameInput').value = activeBand.name;
                document.getElementById('renameBandUrlInput').value = activeBand.rawUrl || "";
            }

            loadSongsFromActiveBand();
        }

        // Povezivanje na drajv aktivnog benda i osvežavanje repertoara
        async function loadSongsFromActiveBand() {
            // Potpuno rešeno prazno stanje i prekidanje API pretraga kada nema selektovanog drajva
            if (bands.length === 0 || !activeBandId) {
                songsList.innerHTML = `<div style="padding:15px; text-align:center; color:#94a3b8;">${i18n[currentLang].noBands}</div>`;
                document.getElementById('mixerContainer').innerHTML = "";
                updateStatusText('statusInit');
                return;
            }

            const activeBand = bands.find(b => b.id === activeBandId);
            if (!activeBand) return;

            if (GIGSTEMS_API_KEY === "UPISI_OVDE_SVOJ_API_KLJUC") {
                songsList.innerHTML = `<div style="padding:15px; color:#ef4444; font-size:0.85em; text-align:center;">Unesi svoj Google API ključ u kod (linija ~143 u index.html) da bi učitao pesme sa Drive-a!</div>`;
                return;
            }

            songsList.innerHTML = `<div style="padding:15px; text-align:center; color:#94a3b8;">${i18n[currentLang].statusConnecting}</div>`;
            
            // Upit za povlačenje podfoldera iz aktivnog krovnog foldera benda
            const query = `'${activeBand.folderId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&key=${GIGSTEMS_API_KEY}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Mrežni problem sa Drive API-jem");

                const data = await response.json();
                allSongs = data.files || [];

                // Sortiramo pesme abecedno
                allSongs.sort((a, b) => a.name.localeCompare(b.name));

                renderSongsList(allSongs);
            } catch (err) {
                songsList.innerHTML = `<div style="padding:15px; color:#ef4444; font-size:0.85em; text-align:center;">${i18n[currentLang].statusConnError}</div>`;
                console.error("Greška pri učitavanju pesama:", err);
            }
        }

        // Prikaz pesama u Sidebar listi
        function renderSongsList(songsArray) {
            songsList.innerHTML = "";
            
            if (songsArray.length === 0) {
                songsList.innerHTML = `<div style="padding:15px; text-align:center; color:#94a3b8;">${i18n[currentLang].noSongs}</div>`;
                return;
            }

            songsArray.forEach(song => {
                const div = document.createElement('div');
                div.className = "song-item";
                div.innerText = song.name;
                div.id = `song-item-${song.id}`;
                div.onclick = () => loadSongStems(song.id, song.name);
                songsList.appendChild(div);
            });
        }

        // Brzi filter pretrage pesama na osnovu unetog teksta (Live Search)
        function filterSongs(queryText) {
            const query = queryText.toLowerCase().trim();
            const filtered = allSongs.filter(song => song.name.toLowerCase().includes(query));
            renderSongsList(filtered);
        }

        // Klizno otvaranje/zatvaranje Repertoar menija na telefonima
        function toggleSidebar(isOpen) {
            const sidebar = document.getElementById('appSidebar');
            const overlay = document.getElementById('sidebarOverlay');

            if (isOpen) {
                sidebar.classList.add('open');
                overlay.classList.add('open');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            }
        }

        // Glavni asinhroni pokretač učitavanja pesama
        async function loadSongStems(songFolderId, songName) {
            // Ako smo na mobilnom, zatvaramo klizni meni čim izaberemo pesmu radi boljeg UX
            toggleSidebar(false);

            // Vizuelno označavamo izabranu pesmu u listi kao aktivnu
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`song-item-${songFolderId}`);
            if (activeEl) activeEl.classList.add('active');

            // Zaustavljamo prethodni audio, čistimo buffere i miksetu
            stopAudio();
            updateStatusText('statusLoading');
            playBtn.disabled = true;
            stopBtn.disabled = true;
            document.getElementById('mixerContainer').innerHTML = '';

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Kreiranje krovnog master regulatora jačine zvuka
            if (!masterGainNode) {
                masterGainNode = audioCtx.createGain();
                const savedMasterVol = localStorage.getItem('gigstems_master_volume');
                const initMasterVol = savedMasterVol !== null ? parseFloat(savedMasterVol) : 0.8;
                masterGainNode.gain.setValueAtTime(isMasterMuted ? 0 : initMasterVol, audioCtx.currentTime);
                masterGainNode.connect(audioCtx.destination);
            }

            audioBuffers = [];
            trackNames = [];
            gainNodes = [];
            totalDuration = 0;
            currentSongName = songName;

            // Formiramo upit za Google Drive API v3 koji traži samo audio fajlove unutar podfoldera izabrane pesme
            const query = `'${songFolderId}' in parents and trashed = false and (mimeType contains 'audio/' or name contains '.mp3' or name contains '.wav' or name contains '.m4a')`;
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&key=${GIGSTEMS_API_KEY}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Greška pri dohvatanju fajlova pesme");
                
                const data = await response.json();
                const files = data.files || [];

                if (files.length === 0) {
                    updateStatusText('statusNoFiles');
                    alert(i18n[currentLang].statusNoFiles);
                    return;
                }

                // Sortiranje fajlova po imenu
                files.sort((a, b) => a.name.localeCompare(b.name));

                // Prolazimo kroz sve fajlove, preuzimamo binarne podatke i dekodiramo ih direktno u RAM memoriju
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusLabel.innerText = `${i18n[currentLang].statusDecoding} [${i + 1}/${files.length}]: ${file.name}...`;

                    // Pozivamo Google Drive API media endpoint za preuzimanje samog audio fajla (bita)
                    const fileUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${GIGSTEMS_API_KEY}`;
                    const fileResponse = await fetch(fileUrl);
                    
                    if (!fileResponse.ok) {
                        throw new Error("HTTP greška pri preuzimanju");
                    }

                    const arrayBuffer = await fileResponse.arrayBuffer();
                    const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
                    
                    audioBuffers.push(decodedData);
                    
                    // Funkcija za prečišćavanje naziva traka (sklanja ekstenzije i početne brojeve npr. 01_bass -> bass)
                    let cleanName = file.name.replace(/\.[^/.]+$/, ""); // uklanja ekstenziju
                    cleanName = cleanName.replace(/^\d+[\s_.-]*/, ""); // uklanja brojeve i znakove sa početka
                    cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                    
                    trackNames.push(cleanName);

                    if (decodedData.duration > totalDuration) {
                        totalDuration = decodedData.duration;
                    }
                }

                updateStatusText('statusReady', files.length);
                document.getElementById('totalTime').innerText = formatTime(totalDuration);
                
                buildMixer();
                
                playBtn.disabled = false;
                stopBtn.disabled = false;

            } catch (err) {
                updateStatusText('statusError');
                console.error("Greška u Audio Engine-u tokom strimovanja:", err);
            }
        }

        // Dinamičko kreiranje miksete na ekranu na osnovu učitanih traka
        function buildMixer() {
            const container = document.getElementById('mixerContainer');
            container.innerHTML = '';

            // Učitavanje sačuvanog miksa za ovu pesmu iz Local Storage-a
            let savedMix = {};
            if (currentSongName) {
                const rawSave = localStorage.getItem('gigstems_mix_' + currentSongName);
                if (rawSave) {
                    try {
                        savedMix = JSON.parse(rawSave);
                    } catch (e) {
                        console.error("Greška pri čitanju sačuvanog miksa:", e);
                    }
                }
            }

            trackNames.forEach((name, index) => {
                const trackPreset = savedMix[name] || { volume: 0.8, muted: false, solo: false };

                const gainNode = audioCtx.createGain();
                gainNode.gain.value = trackPreset.muted ? 0 : trackPreset.volume;
                gainNodes.push(gainNode);

                const strip = document.createElement('div');
                strip.className = 'track-strip';

                const muteClass = trackPreset.muted ? "btn-mute active" : "btn-mute";
                const soloClass = trackPreset.solo ? "btn-solo active" : "btn-solo";

                strip.innerHTML = `
                    <div class="track-name" title="${name}">${name}</div>
                    <div class="volume-slider-container">
                        <input type="range" class="track-volume-slider" min="0" max="1" step="0.01" value="${trackPreset.volume}" oninput="setVolume(${index}, this.value)">
                    </div>
                    <button id="muteBtn-${index}" class="${muteClass}" onclick="toggleMute(${index})">MUTE</button>
                    <button id="soloBtn-${index}" class="${soloClass}" onclick="toggleSolo(${index})">SOLO</button>
                `;
                container.appendChild(strip);
            });

            applyGainsFromUI();
        }

        // Centralni algoritam za izračunavanje i primenu Gain vrednosti na osnovu stanja UI dugmića.
        function applyGainsFromUI() {
            if (!audioCtx) return;

            // Proveravamo da li je aktivan ijedan Solo taster
            let isAnySoloActive = false;
            trackNames.forEach((_, i) => {
                const soloBtn = document.getElementById(`soloBtn-${i}`);
                if (soloBtn && soloBtn.classList.contains('active')) {
                    isAnySoloActive = true;
                }
            });

            trackNames.forEach((_, i) => {
                const slider = document.querySelectorAll('.track-volume-slider')[i];
                const vol = slider ? parseFloat(slider.value) : 0.8;
                const isMuted = document.getElementById(`muteBtn-${i}`).classList.contains('active');
                const isSolo = document.getElementById(`soloBtn-${i}`).classList.contains('active');

                let finalGain = vol;

                if (isMuted) {
                    finalGain = 0;
                } else if (isAnySoloActive && !isSolo) {
                    finalGain = 0;
                }

                if (gainNodes[i]) {
                    gainNodes[i].gain.setValueAtTime(finalGain, audioCtx.currentTime);
                }
            });
        }

        // Funkcija koja snima trenutni izgled miksete za aktivnu pesmu u Local Storage browsera
        function saveMixState() {
            if (!currentSongName) return;

            const mixState = {};
            trackNames.forEach((name, index) => {
                const slider = document.querySelectorAll('.track-volume-slider')[index];
                const isMuted = document.getElementById(`muteBtn-${index}`).classList.contains('active');
                const isSolo = document.getElementById(`soloBtn-${index}`).classList.contains('active');

                mixState[name] = {
                    volume: slider ? parseFloat(slider.value) : 0.8,
                    muted: isMuted,
                    solo: isSolo
                };
            });

            localStorage.setItem('gigstems_mix_' + currentSongName, JSON.stringify(mixState));
        }

        // Kontrola jačine kanala
        function setVolume(index, value) {
            applyGainsFromUI();
            saveMixState();
        }

        // Mute funkcionalnost
        function toggleMute(index) {
            const btn = document.getElementById(`muteBtn-${index}`);
            btn.classList.toggle('active');
            applyGainsFromUI();
            saveMixState();
        }

        // Solo funkcionalnost
        function toggleSolo(index) {
            const btn = document.getElementById(`soloBtn-${index}`);
            btn.classList.toggle('active');
            applyGainsFromUI();
            saveMixState();
        }

        // Podešavanje globalne jačine zvuka celog sistema (Master Volume)
        function setMasterVolume(value) {
            localStorage.setItem('gigstems_master_volume', value);
            if (!audioCtx || !masterGainNode) return;
            
            if (!isMasterMuted) {
                masterGainNode.gain.setValueAtTime(value, audioCtx.currentTime);
            }
        }

        // Globalno mutiranje kompletnog zvuka (Master Mute)
        function toggleMasterMute() {
            if (!audioCtx || !masterGainNode) return;

            const btn = document.getElementById('masterMuteBtn');
            isMasterMuted = !isMasterMuted;

            if (isMasterMuted) {
                btn.classList.add('active');
                masterGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                btn.classList.remove('active');
                const sliderVal = parseFloat(document.getElementById('masterVolumeSlider').value);
                masterGainNode.gain.setValueAtTime(sliderVal, audioCtx.currentTime);
            }
        }

        // Play i Pause logika sa sinhronim startom u milisekundu
        function togglePlay() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                // Pause stanje
                pauseOffset += audioCtx.currentTime - startTime;
                stopSourceNodes();
                isPlaying = false;
                updatePlayBtnUI();
                clearInterval(timerInterval);
            } else {
                // Play stanje
                if (pauseOffset >= totalDuration) {
                    pauseOffset = 0; // Vrati na početak ako je pesma završena
                }
                startSourceNodes(pauseOffset);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                updatePlayBtnUI();
                timerInterval = setInterval(updateUI, 100);
            }
        }

        // Pokretanje svih audio čvorova u tačnom vremenskom trenutku
        function startSourceNodes(offset) {
            sourceNodes = [];
            audioBuffers.forEach((buffer, index) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                source.connect(gainNodes[index]);
                gainNodes[index].connect(masterGainNode);
                
                if (offset < buffer.duration) {
                    source.start(0, offset);
                } else {
                    source.start(0, buffer.duration);
                }
                sourceNodes.push(source);
            });
        }

        function stopSourceNodes() {
            sourceNodes.forEach(node => {
                try { node.stop(); } catch(err) {}
            });
            sourceNodes = [];
        }

        // Potpuno zaustavljanje i resetovanje plejera
        function stopAudio() {
            stopSourceNodes();
            isPlaying = false;
            pauseOffset = 0;
            updatePlayBtnUI();
            document.getElementById('currentTime').innerText = "00:00";
            document.getElementById('seekBar').value = 0;
            clearInterval(timerInterval);
        }

        // Logika za premotavanje pesme (Seeking)
        function onSeek(value) {
            const wasPlaying = isPlaying;
            if (isPlaying) {
                togglePlay(); // Privremeno pauziraj
            }
            pauseOffset = (value / 100) * totalDuration;
            document.getElementById('currentTime').innerText = formatTime(pauseOffset);
            
            if (wasPlaying) {
                togglePlay(); // Nastavi da sviraš sa nove lokacije
            }
        }

        // Praćenje vremena i pomeranje klizača tokom reprodukcije
        function updateUI() {
            if (!isPlaying) return;
            const elapsed = pauseOffset + (audioCtx.currentTime - startTime);
            
            if (elapsed >= totalDuration) {
                stopAudio();
                return;
            }

            document.getElementById('currentTime').innerText = formatTime(elapsed);
            document.getElementById('seekBar').value = (elapsed / totalDuration) * 100;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
    </script>
</body>
