<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigStems - Prototip v1.1.0</title>
    <!-- Poziv eksternog CSS-a radi očuvanja konzistentnosti dizajna -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>GigStems</h1>
    <p class="subtitle">v1.1.0 • Lokalno učitavanje foldera</p>

    <!-- Kontrolna Tabla -->
    <div class="controls-master">
        <div class="buttons-row">
            <!-- #NOVO v1.1.0 - Dugme za dinamičko učitavanje celog lokalnog foldera sa pesmom -->
            <label class="file-label" style="background: #334155; color: #f8fafc; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; width: 60%; box-sizing: border-box; display: inline-block;">
                📁 Učitaj folder
                <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
            </label>
            <button id="stopBtn" class="btn-stop" onclick="stopAudio()" disabled>
                <span>◼ Zaustavi</span>
            </button>
        </div>

        <div class="buttons-row" style="margin-top: 10px;">
            <button id="playBtn" class="btn-play" onclick="togglePlay()" disabled style="width: 100%;">
                <span>▶ Pusti trake</span>
            </button>
        </div>

        <div class="seekbar-container" style="margin-top: 12px;">
            <input type="range" id="seekBar" class="seekbar" min="0" max="100" value="0" oninput="onSeek(this.value)">
        </div>

        <div class="time-container">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <!-- Status Učitavanja i Sinhronizacije -->
    <div id="statusLabel" class="status-box">Izaberi lokalni folder sa stemovima pesme da započneš...</div>

    <!-- Mikseta -->
    <div id="mixerContainer" class="mixer"></div>

    <script>
        // Inicijalizacija Web Audio API-ja i globalnih promenljivih
        let audioCtx;
        let audioBuffers = [];
        let sourceNodes = [];
        let gainNodes = [];
        let trackNames = [];
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;
        let totalDuration = 0;
        let timerInterval;

        const folderInput = document.getElementById('folderInput');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusLabel = document.getElementById('statusLabel');

        // #NOVO v1.1.0 - Osluškivač za izbor lokalnog foldera
        folderInput.addEventListener('change', async (e) => {
            // Filtriramo samo audio fajlove (mp3, wav, ogg, m4a...)
            const files = Array.from(e.target.files).filter(file => {
                return file.type.startsWith('audio/') || 
                       file.name.endsWith('.mp3') || 
                       file.name.endsWith('.wav') || 
                       file.name.endsWith('.m4a');
            });
            
            if (files.length === 0) {
                alert("Nema ispravnih audio fajlova u izabranom folderu!");
                return;
            }

            // Zaustavljamo prethodni audio ako je svirao i čistimo stare podatke
            stopAudio();
            statusLabel.innerText = "Učitavam i sinhronizujem trake u memoriju (RAM)...";
            playBtn.disabled = true;
            stopBtn.disabled = true;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            audioBuffers = [];
            trackNames = [];
            gainNodes = [];
            totalDuration = 0;

            // #NOVO v1.1.0 - Sortiranje fajlova po imenu kako bismo uvek imali isti raspored kanala
            files.sort((a, b) => a.name.localeCompare(b.name));

            try {
                // Prolazimo kroz sve fajlove i dekodiramo ih u RAM memoriju
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusLabel.innerText = `Dekodiram kanal [${i + 1}/${files.length}]: ${file.name}...`;
                    
                    const arrayBuffer = await file.arrayBuffer();
                    const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
                    
                    audioBuffers.push(decodedData);
                    
                    // #NOVO v1.1.0 - Funkcija za prečišćavanje naziva traka (sklanja ekstenzije i početne brojeve npr. 01_bass -> bass)
                    let cleanName = file.name.replace(/\.[^/.]+$/, ""); // uklanja ekstenziju (.mp3, .wav...)
                    cleanName = cleanName.replace(/^\d+[\s_.-]*/, ""); // uklanja brojeve i znakove sa početka (01_, 02-, itd.)
                    // Prvo slovo veliko radi lepše estetike miksete
                    cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                    
                    trackNames.push(cleanName);

                    // Određujemo najdužu traku kao ukupnu dužinu cele pesme
                    if (decodedData.duration > totalDuration) {
                        totalDuration = decodedData.duration;
                    }
                }

                statusLabel.innerText = `Učitano je ${files.length} traka. Spremno za svirku!`;
                document.getElementById('totalTime').innerText = formatTime(totalDuration);
                
                // Dinamički gradimo miksetu sa tačnim brojem učitanih traka
                buildMixer();
                
                playBtn.disabled = false;
                stopBtn.disabled = false;
            } catch (err) {
                statusLabel.innerText = "Greška pri učitavanju i dekodiranju fajlova.";
                console.error("Greška u Audio Engine-u:", err);
            }
        });

        // Dinamičko kreiranje miksete na ekranu na osnovu učitanih traka
        function buildMixer() {
            const container = document.getElementById('mixerContainer');
            container.innerHTML = '';

            trackNames.forEach((name, index) => {
                // Kreiramo GainNode (regulator jačine) za svaki kanal posebno
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.8; // Podrazumevana jačina na 80%
                gainNodes.push(gainNode);

                const strip = document.createElement('div');
                strip.className = 'track-strip';
                strip.innerHTML = `
                    <div class="track-name" title="${name}">${name}</div>
                    <div class="volume-slider-container">
                        <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(${index}, this.value)">
                    </div>
                    <button id="muteBtn-${index}" class="btn-mute" onclick="toggleMute(${index})">MUTE</button>
                    <button id="soloBtn-${index}" class="btn-solo" onclick="toggleSolo(${index})">SOLO</button>
                `;
                container.appendChild(strip);
            });
        }

        // Kontrola jačine kanala
        function setVolume(index, value) {
            const isMuted = document.getElementById(`muteBtn-${index}`).classList.contains('active');
            if (!isMuted) {
                gainNodes[index].gain.setValueAtTime(value, audioCtx.currentTime);
            }
        }

        // Mute funkcionalnost bez ispadanja iz sinhronizacije
        function toggleMute(index) {
            const btn = document.getElementById(`muteBtn-${index}`);
            const slider = btn.parentNode.querySelector('.volume-slider');
            const isActive = btn.classList.toggle('active');

            if (isActive) {
                gainNodes[index].gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                gainNodes[index].gain.setValueAtTime(slider.value, audioCtx.currentTime);
            }
        }

        // Solo funkcionalnost (utišava sve ostale kanale)
        function toggleSolo(index) {
            const btn = document.getElementById(`soloBtn-${index}`);
            const isSoloActive = btn.classList.toggle('active');

            gainNodes.forEach((gn, i) => {
                const sliderVal = document.getElementById(`mixerContainer`).querySelectorAll('.volume-slider')[i].value;
                const isMuted = document.getElementById(`muteBtn-${i}`).classList.contains('active');
                const soloBtn = document.getElementById(`soloBtn-${i}`);

                if (isSoloActive) {
                    if (i !== index) {
                        gn.gain.setValueAtTime(0, audioCtx.currentTime);
                        soloBtn.classList.remove('active');
                    } else {
                        gn.gain.setValueAtTime(isMuted ? 0 : sliderVal, audioCtx.currentTime);
                    }
                } else {
                    gn.gain.setValueAtTime(isMuted ? 0 : sliderVal, audioCtx.currentTime);
                }
            });
        }

        // Play i Pause logika sa sinhronim startom u milisekundu
        function togglePlay() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                // Pause stanje
                pauseOffset += audioCtx.currentTime - startTime;
                stopSourceNodes();
                isPlaying = false;
                playBtn.innerHTML = "<span>▶ Pusti trake</span>";
                clearInterval(timerInterval);
            } else {
                // Play stanje
                if (pauseOffset >= totalDuration) {
                    pauseOffset = 0; // Vrati na početak ako je pesma završena
                }
                startSourceNodes(pauseOffset);
                startTime = audioCtx.currentTime;
                isPlaying = true;
                playBtn.innerHTML = "<span>⏸ Pauziraj</span>";
                timerInterval = setInterval(updateUI, 100);
            }
        }

        // Pokretanje svih audio čvorova u tačnom vremenskom trenutku
        function startSourceNodes(offset) {
            sourceNodes = [];
            audioBuffers.forEach((buffer, index) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                // Povezujemo izvor na kanalni Gain, a kanalni Gain na zvučnike (destination)
                source.connect(gainNodes[index]);
                gainNodes[index].connect(audioCtx.destination);
                
                if (offset < buffer.duration) {
                    source.start(0, offset);
                } else {
                    source.start(0, buffer.duration);
                }
                sourceNodes.push(source);
            });
        }

        function stopSourceNodes() {
            sourceNodes.forEach(node => {
                try { node.stop(); } catch(err) {}
            });
            sourceNodes = [];
        }

        // Potpuno zaustavljanje i resetovanje plejera
        function stopAudio() {
            stopSourceNodes();
            isPlaying = false;
            pauseOffset = 0;
            playBtn.innerHTML = "<span>▶ Pusti trake</span>";
            document.getElementById('currentTime').innerText = "00:00";
            document.getElementById('seekBar').value = 0;
            clearInterval(timerInterval);
        }

        // Logika za premotavanje pesme (Seeking)
        function onSeek(value) {
            const wasPlaying = isPlaying;
            if (isPlaying) {
                togglePlay(); // Privremeno pauziraj
            }
            pauseOffset = (value / 100) * totalDuration;
            document.getElementById('currentTime').innerText = formatTime(pauseOffset);
            
            if (wasPlaying) {
                togglePlay(); // Nastavi da sviraš sa nove lokacije
            }
        }

        // Praćenje vremena i pomeranje klizača tokom reprodukcije
        function updateUI() {
            if (!isPlaying) return;
            const elapsed = pauseOffset + (audioCtx.currentTime - startTime);
            
            if (elapsed >= totalDuration) {
                stopAudio();
                return;
            }

            document.getElementById('currentTime').innerText = formatTime(elapsed);
            document.getElementById('seekBar').value = (elapsed / totalDuration) * 100;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
    </script>
</body>
</html>
